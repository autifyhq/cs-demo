<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Angular Mock Test (No ID)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f5f8; }
        .row { display: flex; flex-wrap: wrap; margin-bottom: 1rem; }
        .col-md-10 { flex: 0 0 83.33%; max-width: 83.33%; }
        .col { flex-basis: 0; flex-grow: 1; padding-left: 10px; }
        .form-control, .form-select { 
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; 
        }
        /* Angular状態別スタイル */
        .ng-invalid.ng-touched { border: 1px solid #eb445a !important; }
        .ng-valid { border-left: 5px solid #28a745; }
        
        .button-native {
            background: #3dc2ff; color: white; border: none; padding: 10px 20px;
            border-radius: 4px; cursor: pointer;
        }
        .button-native:disabled { background: #ccc; cursor: not-allowed; }
        app-error-messages { color: #eb445a; font-size: 12px; display: block; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <form _ngcontent-ng-c9876543210="" novalidate="" class="ng-untouched ng-pristine ng-invalid">
        
        <div _ngcontent-ng-c9876543210="" class="row">
            <div _ngcontent-ng-c9876543210="" class="col-md-10">
                <input 
                    _ngcontent-ng-c9876543210="" 
                    type="file" 
                    accept=".csv" 
                    class="form-control ng-untouched ng-pristine ng-invalid">
                
                <app-error-messages _ngcontent-ng-c9876543210="">
                    </app-error-messages>
            </div>

            <div _ngcontent-ng-c9876543210="" class="col">
                <select _ngcontent-ng-c9876543210="" class="form-select ng-untouched ng-pristine ng-valid">
                    <option value="sjis">SJIS</option>
                    <option value="utf8">UTF8</option>
                </select>
            </div>
        </div>

        <div _ngcontent-ng-c9876543210="" style="text-align:center; margin-top: 20px;">
            <ion-button _ngcontent-ng-c9876543210="">
                <button type="button" class="button-native" disabled>アップロード</button>
            </ion-button>
        </div>
    </form>
</div>

<script>
    // IDがないため、属性セレクターで要素を取得するシミュレーション
    const fileInput = document.querySelector('input[type="file"]');
    const submitBtn = document.querySelector('.button-native');
    const errorContainer = document.querySelector('app-error-messages');

    fileInput.addEventListener('change', (e) => {
        fileInput.classList.remove('ng-pristine');
        if (e.target.files.length > 0) {
            fileInput.classList.remove('ng-invalid');
            fileInput.classList.add('ng-valid');
            submitBtn.disabled = false;
            errorContainer.innerText = "";
        } else {
            fileInput.classList.add('ng-invalid');
            submitBtn.disabled = true;
            errorContainer.innerText = "ファイルを選択してください。";
        }
    });

    fileInput.addEventListener('blur', () => {
        fileInput.classList.remove('ng-untouched');
        fileInput.classList.add('ng-touched');
    });
</script>

</body>
</html>
