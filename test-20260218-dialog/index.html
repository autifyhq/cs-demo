<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>10秒無操作でOK/キャンセル</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; }
    .box { max-width: 680px; line-height: 1.6; }
    code { background: #f3f3f3; padding: 0 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>10秒間なにもしないとダイアログ</h1>
    <p>
      マウス移動 / クリック / キー入力 / スクロールなどの操作が <code>10秒</code> ないと、
      <code>confirm()</code> ダイアログ（OK / キャンセル）が出ます。
    </p>
    <p>試すにはこのまま手を止めてください。</p>
    <p id="status"></p>
  </div>

  <script>
    const IDLE_MS = 10_000;

    let timerId = null;
    let lastActivityAt = Date.now();

    const statusEl = document.getElementById("status");

    function render() {
      const remaining = Math.max(0, IDLE_MS - (Date.now() - lastActivityAt));
      statusEl.textContent = `次のダイアログまで: ${(remaining / 1000).toFixed(1)} 秒`;
    }

    function startTimer() {
      stopTimer();
      timerId = window.setTimeout(() => {
        const ok = window.confirm("10秒間操作がありませんでした。続行しますか？");
        // ダイアログを閉じた後も、また無操作10秒で出るようにリセット
        resetIdleTimer();

        // 結果表示（任意）
        if (ok) {
          console.log("OK が押されました");
        } else {
          console.log("キャンセル が押されました");
        }
      }, IDLE_MS);
    }

    function stopTimer() {
      if (timerId !== null) {
        clearTimeout(timerId);
        timerId = null;
      }
    }

    function resetIdleTimer() {
      lastActivityAt = Date.now();
      startTimer();
      render();
    }

    // どの操作を「活動」とみなすか
    const activityEvents = [
      "mousemove",
      "mousedown",
      "click",
      "scroll",
      "keydown",
      "touchstart",
      "pointerdown",
      "wheel"
    ];

    for (const ev of activityEvents) {
      window.addEventListener(ev, resetIdleTimer, { passive: true });
    }

    // 表示更新（見た目用）
    setInterval(render, 100);

    // 初期化
    resetIdleTimer();
  </script>
</body>
</html>
